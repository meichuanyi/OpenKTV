<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenKTV · 曲库管理</title>
<style>
:root{--bg:#07071a;--card:#10102a;--accent:#c736f7;--cyan:#36d9f7;--pink:#ff4f9b;--text:#f4f4ff;--sub:#8888aa}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
header{
  position:sticky;top:0;z-index:10;padding:16px 24px;
  background:rgba(7,7,26,.92);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.07);
  display:flex;align-items:center;gap:14px
}
.logo{font-size:20px;font-weight:900;background:linear-gradient(90deg,var(--cyan),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{font-size:13px;color:var(--sub);font-weight:400;margin-left:6px}
.spacer{flex:1}
.hbtn{
  padding:8px 18px;border-radius:10px;font-size:13px;cursor:pointer;border:none;color:#fff;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);transition:.2s
}
.hbtn:hover{background:rgba(199,54,247,.3);border-color:var(--accent)}
.hbtn.primary{background:linear-gradient(135deg,var(--accent),var(--cyan));border:none;font-weight:600;color:#07071a}

main{max-width:960px;margin:0 auto;padding:24px}

/* Stats */
.stats-row{display:flex;gap:14px;margin-bottom:24px}
.stat{flex:1;background:var(--card);border-radius:14px;padding:18px;text-align:center;border:1px solid rgba(255,255,255,.06)}
.stat .n{font-size:32px;font-weight:800;color:var(--accent)}
.stat .l{font-size:12px;color:var(--sub);margin-top:4px}

/* Search & filter */
.toolbar{display:flex;gap:10px;margin-bottom:16px}
.search-box{
  flex:1;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.06);border-radius:12px;padding:10px 14px;
  border:1px solid rgba(255,255,255,.08)
}
.search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px}

/* Table */
.song-table{width:100%;border-collapse:collapse}
.song-table th{
  text-align:left;padding:10px 14px;font-size:12px;color:var(--sub);
  border-bottom:1px solid rgba(255,255,255,.07);white-space:nowrap
}
.song-table td{padding:10px 14px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.04)}
.song-table tr:hover td{background:rgba(255,255,255,.03)}
.song-table .title-cell{font-weight:600}
.song-table .artist-cell{color:var(--sub);font-size:13px}
.song-table .count-cell{color:var(--cyan);font-size:13px;text-align:right}
.row-acts{display:flex;gap:6px;justify-content:flex-end}
.act-btn{
  padding:4px 12px;border-radius:8px;font-size:12px;border:none;cursor:pointer
}
.act-edit{background:rgba(54,217,247,.15);color:var(--cyan)}
.act-del{background:rgba(255,79,155,.15);color:var(--pink)}
.act-btn:hover{opacity:.8}

/* Edit modal */
#modal-overlay{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);
  display:none;align-items:center;justify-content:center
}
#modal-overlay.open{display:flex}
#modal{
  background:#12122e;border-radius:18px;padding:28px;width:420px;max-width:90vw;
  border:1px solid rgba(255,255,255,.1)
}
#modal h3{font-size:17px;margin-bottom:20px}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.form-row input{
  width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;outline:none
}
.form-row input:focus{border-color:var(--accent)}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* Scan log */
#scan-log{
  background:var(--card);border-radius:14px;padding:16px;margin-top:20px;
  font-size:13px;color:var(--sub);display:none;border:1px solid rgba(255,255,255,.06)
}
#scan-log.show{display:block}
#scan-log pre{color:var(--cyan);margin-top:8px;font-size:12px}

/* Toast */
#toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-70px);
  background:rgba(20,20,50,.95);border:1px solid rgba(199,54,247,.4);
  padding:10px 22px;border-radius:12px;font-size:14px;z-index:99;
  backdrop-filter:blur(12px);transition:transform .28s
}
#toast.show{transform:translateX(-50%) translateY(0)}

.empty{text-align:center;color:#444;padding:40px 0;font-size:14px}

/* Login gate */
#login-overlay{
  position:fixed;inset:0;z-index:200;background:var(--bg);
  display:flex;align-items:center;justify-content:center
}
#login-overlay.hidden{display:none}
.auth-box{
  background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:18px;
  padding:36px 32px;width:340px;max-width:88vw;text-align:center
}
.auth-box .lg-title{font-size:20px;font-weight:800;margin-bottom:6px}
.auth-box .lg-sub{color:var(--sub);font-size:13px;margin-bottom:22px}
.auth-box input{
  width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px;outline:none;margin-bottom:14px
}
.auth-box input:focus{border-color:var(--accent)}
.auth-box button{
  width:100%;padding:12px;border-radius:10px;border:none;font-weight:600;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--cyan));color:#07071a;font-size:14px
}
#login-err,#setup-err{color:var(--pink);font-size:12px;margin:-6px 0 12px;min-height:14px}
.hidden{display:none !important}

/* Change password modal (reuses #modal styling) */
#pw-modal-overlay{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);
  display:none;align-items:center;justify-content:center
}
#pw-modal-overlay.open{display:flex}
#pw-modal{
  background:#12122e;border-radius:18px;padding:28px;width:420px;max-width:90vw;
  border:1px solid rgba(255,255,255,.1)
}
#pw-modal h3{font-size:17px;margin-bottom:20px}
</style>
</head>
<body>
<div id="login-overlay">
  <div id="login-box" class="auth-box hidden">
    <div class="lg-title">🔒 曲库管理</div>
    <div class="lg-sub">请输入管理员密码登录</div>
    <input id="login-password" type="password" placeholder="管理员密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="login-err"></div>
    <button onclick="doLogin()">登录</button>
  </div>
  <div id="setup-box" class="auth-box hidden">
    <div class="lg-title">👋 欢迎使用曲库管理</div>
    <div class="lg-sub">首次使用，请先设置一个管理员密码</div>
    <input id="setup-password" type="password" placeholder="设置密码（至少 4 位）" autocomplete="new-password" onkeydown="if(event.key==='Enter')document.getElementById('setup-password2').focus()">
    <input id="setup-password2" type="password" placeholder="再次输入密码" autocomplete="new-password" onkeydown="if(event.key==='Enter')doSetup()">
    <div id="setup-err"></div>
    <button onclick="doSetup()">设置密码并登录</button>
  </div>
</div>

<header>
  <div class="logo">OpenKTV <span>曲库管理</span></div>
  <div class="spacer"></div>
  <button class="hbtn" onclick="window.open('/tv','_blank')">📺 TV端</button>
  <button class="hbtn" onclick="window.open('/m','_blank')">📱 手机端</button>
  <button class="hbtn primary" onclick="doScan()">🔄 扫描曲库</button>
  <button class="hbtn" onclick="openPwModal()">🔑 修改密码</button>
  <button class="hbtn" onclick="doLogout()">🚪 退出登录</button>
</header>

<main>
  <div class="stats-row">
    <div class="stat"><div class="n" id="s-total">—</div><div class="l">总曲目</div></div>
    <div class="stat"><div class="n" id="s-queue">—</div><div class="l">队列中</div></div>
    <div class="stat"><div class="n" id="s-plays">—</div><div class="l">累计播放</div></div>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <span>🔍</span>
      <input id="search" placeholder="搜索歌名 / 歌手…" oninput="doSearch(this.value)">
    </div>
  </div>

  <table class="song-table">
    <thead>
      <tr>
        <th>#</th><th>歌名</th><th>歌手</th><th style="text-align:right">播放</th><th style="text-align:right">操作</th>
      </tr>
    </thead>
    <tbody id="song-tbody"></tbody>
  </table>
  <div class="empty" id="empty-tip" style="display:none">暂无歌曲，请先扫描曲库</div>

  <div id="scan-log">
    <b>扫描结果</b>
    <pre id="scan-pre"></pre>
  </div>
</main>

<!-- Edit modal -->
<div id="modal-overlay" onclick="closeModal()">
  <div id="modal" onclick="event.stopPropagation()">
    <h3>✏️ 编辑歌曲信息</h3>
    <div class="form-row"><label>歌名</label><input id="edit-title" placeholder="歌名"></div>
    <div class="form-row"><label>歌手</label><input id="edit-artist" placeholder="歌手"></div>
    <input type="hidden" id="edit-id">
    <div class="modal-btns">
      <button class="hbtn" onclick="closeModal()">取消</button>
      <button class="hbtn primary" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<!-- Change password modal -->
<div id="pw-modal-overlay" onclick="closePwModal()">
  <div id="pw-modal" onclick="event.stopPropagation()">
    <h3>🔑 修改管理员密码</h3>
    <div class="form-row"><label>当前密码</label><input id="pw-old" type="password" autocomplete="current-password"></div>
    <div class="form-row"><label>新密码</label><input id="pw-new" type="password" autocomplete="new-password" placeholder="至少 4 位"></div>
    <div class="form-row"><label>确认新密码</label><input id="pw-new2" type="password" autocomplete="new-password"></div>
    <div id="pw-err" style="color:var(--pink);font-size:12px;min-height:14px;margin-bottom:8px"></div>
    <div class="modal-btns">
      <button class="hbtn" onclick="closePwModal()">取消</button>
      <button class="hbtn primary" onclick="submitChangePassword()">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let allSongs = [];

// ---------- 登录状态 ----------
async function checkSession(){
  try{
    const r = await fetch('/api/admin/session');
    const d = await r.json();
    if(d.authed){ showApp(); }
    else if(!d.passwordSet){ showSetup(); }
    else{ showLogin(); }
  }catch(e){ showLogin(); }
}

function showLogin(){
  document.getElementById('login-overlay').classList.remove('hidden');
  document.getElementById('setup-box').classList.add('hidden');
  document.getElementById('login-box').classList.remove('hidden');
}

function showSetup(){
  document.getElementById('login-overlay').classList.remove('hidden');
  document.getElementById('login-box').classList.add('hidden');
  document.getElementById('setup-box').classList.remove('hidden');
}

function showApp(){
  document.getElementById('login-overlay').classList.add('hidden');
  loadAll();
}

async function doSetup(){
  const p1 = document.getElementById('setup-password').value;
  const p2 = document.getElementById('setup-password2').value;
  const errEl = document.getElementById('setup-err');
  errEl.textContent = '';
  if(!p1 || p1.length < 4){ errEl.textContent = '密码至少 4 位'; return; }
  if(p1 !== p2){ errEl.textContent = '两次输入的密码不一致'; return; }
  try{
    const r = await fetch('/api/admin/setup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: p1 }),
    });
    if(r.ok){
      document.getElementById('setup-password').value = '';
      document.getElementById('setup-password2').value = '';
      showApp();
    } else {
      const d = await r.json().catch(()=>({}));
      if(r.status === 409){
        // 极端情况：设置过程中另一个标签页已经设置过密码了，回退到登录。
        showLogin();
        document.getElementById('login-err').textContent = d.error || '密码已被设置，请登录';
      } else {
        errEl.textContent = d.error || '设置失败，请重试';
      }
    }
  }catch(e){
    errEl.textContent = '请求失败，请检查网络';
  }
}

async function doLogin(){
  const input = document.getElementById('login-password');
  const errEl = document.getElementById('login-err');
  const pw = input.value;
  errEl.textContent = '';
  if(!pw){ errEl.textContent = '请输入密码'; return; }
  try{
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });
    if(r.ok){
      input.value = '';
      showApp();
    } else {
      const d = await r.json().catch(()=>({}));
      errEl.textContent = d.error || '密码错误';
    }
  }catch(e){
    errEl.textContent = '登录请求失败，请检查网络';
  }
}

function openPwModal(){
  document.getElementById('pw-old').value = '';
  document.getElementById('pw-new').value = '';
  document.getElementById('pw-new2').value = '';
  document.getElementById('pw-err').textContent = '';
  document.getElementById('pw-modal-overlay').classList.add('open');
}
function closePwModal(){ document.getElementById('pw-modal-overlay').classList.remove('open'); }

async function submitChangePassword(){
  const oldPassword = document.getElementById('pw-old').value;
  const newPassword = document.getElementById('pw-new').value;
  const newPassword2 = document.getElementById('pw-new2').value;
  const errEl = document.getElementById('pw-err');
  errEl.textContent = '';
  if(!oldPassword){ errEl.textContent = '请输入当前密码'; return; }
  if(!newPassword || newPassword.length < 4){ errEl.textContent = '新密码至少 4 位'; return; }
  if(newPassword !== newPassword2){ errEl.textContent = '两次输入的新密码不一致'; return; }
  try{
    const r = await fetch('/api/admin/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ oldPassword, newPassword }),
    });
    if(r.ok){
      closePwModal();
      toast('密码已修改 ✓');
    } else if(r.status === 401){
      const d = await r.json().catch(()=>({}));
      errEl.textContent = d.error || '当前密码不正确';
    } else {
      const d = await r.json().catch(()=>({}));
      errEl.textContent = d.error || '修改失败，请重试';
    }
  }catch(e){
    errEl.textContent = '请求失败，请检查网络';
  }
}

async function doLogout(){
  try{ await fetch('/api/admin/logout', { method: 'POST' }); } catch(e){}
  showLogin();
}

async function loadAll(){
  const [stats, songs] = await Promise.all([
    fetch('/api/stats').then(r=>r.json()),
    fetch('/api/songs').then(r=>r.json())
  ]);
  document.getElementById('s-total').textContent = stats.songCount;
  document.getElementById('s-queue').textContent = stats.queueCount;
  allSongs = songs;
  const totalPlays = songs.reduce((a,s)=>a+s.play_count,0);
  document.getElementById('s-plays').textContent = totalPlays;
  render(songs);
}

function render(list){
  const tbody = document.getElementById('song-tbody');
  const empty = document.getElementById('empty-tip');
  tbody.innerHTML = '';
  empty.style.display = list.length ? 'none' : 'block';
  list.forEach((s,i)=>{
    const tr = document.createElement('tr');
    tr.dataset.id = s.id;
    tr.innerHTML = `
      <td style="color:var(--sub);font-size:12px">${i+1}</td>
      <td class="title-cell">${esc(s.title)}</td>
      <td class="artist-cell">${esc(s.artist||'未知歌手')}</td>
      <td class="count-cell">${s.play_count}</td>
      <td>
        <div class="row-acts">
          <button class="act-btn act-edit" onclick="openEdit(${s.id},'${esc(s.title)}','${esc(s.artist||'')}')">编辑</button>
          <button class="act-btn act-del" onclick="delSong(${s.id},this)">删除</button>
        </div>
      </td>`;
    tbody.appendChild(tr);
  });
}

let searchTimer;
function doSearch(q){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async ()=>{
    if(!q.trim()){ render(allSongs); return; }
    const res = await fetch(`/api/songs?q=${encodeURIComponent(q)}`);
    render(await res.json());
  }, 200);
}

async function delSong(id, btn){
  if(!confirm('确认从曲库移除这首歌？（文件本身不会被删除）')) return;
  const res = await fetch(`/api/songs/${id}`, {method:'DELETE'});
  if(res.status===401){ showLogin(); return; }
  btn.closest('tr').remove();
  allSongs = allSongs.filter(s=>s.id!==id);
  document.getElementById('s-total').textContent = allSongs.length;
  toast('已移除 ✓');
}

function openEdit(id, title, artist){
  document.getElementById('edit-id').value = id;
  document.getElementById('edit-title').value = title;
  document.getElementById('edit-artist').value = artist;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); }
async function saveEdit(){
  const id = document.getElementById('edit-id').value;
  const title = document.getElementById('edit-title').value.trim();
  const artist = document.getElementById('edit-artist').value.trim();
  if(!title){ alert('歌名不能为空'); return; }
  const res = await fetch(`/api/songs/${id}`, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,artist})});
  if(res.status===401){ closeModal(); showLogin(); return; }
  closeModal();
  const tr = document.querySelector(`tr[data-id="${id}"]`);
  if(tr){
    tr.querySelector('.title-cell').textContent = title;
    tr.querySelector('.artist-cell').textContent = artist||'未知歌手';
  }
  const s = allSongs.find(x=>x.id==id);
  if(s){ s.title=title; s.artist=artist; }
  toast('已保存 ✓');
}

async function doScan(){
  const log = document.getElementById('scan-log');
  const pre = document.getElementById('scan-pre');
  log.classList.add('show');
  pre.textContent = '扫描中…';
  const res = await fetch('/api/scan',{method:'POST'});
  const d = await res.json();
  pre.textContent = `完成！文件总数：${d.total}  新增：${d.added}  移除：${d.removed}`;
  toast(`扫描完成，共 ${d.total} 首，新增 ${d.added} 首`);
  loadAll();
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/'/g,'&#39;'); }

checkSession();
</script>
</body>
</html>
