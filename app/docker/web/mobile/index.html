<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>骏耀K歌 · 点歌 & 遥控</title>
<style>
:root{
  --bg:#08081c;--card:rgba(255,255,255,0.06);
  --accent:#c736f7;--accent2:#36d9f7;--pink:#ff4f9b;--orange:#ff8c42;
  --text:#f4f4ff;--sub:#8888aa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;
  background:radial-gradient(circle at 15% 0%,rgba(199,54,247,.18),transparent 45%),
             radial-gradient(circle at 85% 30%,rgba(54,169,247,.15),transparent 45%),var(--bg);
  color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:80px}

/* ===== HEADER ===== */
header{
  position:sticky;top:0;z-index:10;
  background:rgba(8,8,28,.9);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.07);padding:14px 16px 0}
.brand{font-size:20px;font-weight:900;letter-spacing:1px;
  background:linear-gradient(90deg,var(--accent2),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent}
/* Tab bar */
.tabs{display:flex;margin-top:12px;gap:2px}
.tab{
  flex:1;text-align:center;padding:10px 0;font-size:12px;white-space:nowrap;
  color:var(--sub);border-bottom:2px solid transparent;transition:.2s
}
.tab.active{color:#fff;border-bottom-color:var(--accent)}

/* ===== SEARCH TAB ===== */
#tab-search .search-box{
  margin:14px 16px 0;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.07);border-radius:14px;padding:11px 14px;
  border:1px solid rgba(255,255,255,.08)}
#tab-search .search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px}
#tab-search .nickname-row{margin:10px 16px 0}
#tab-search .nickname-row input{
  width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:12px;padding:9px 14px;color:var(--text);font-size:13px;outline:none}
#song-list{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.song-card{
  display:flex;align-items:center;background:var(--card);
  border:1px solid rgba(255,255,255,.06);padding:13px 14px;border-radius:16px;gap:12px}
.song-card .info{flex:1}
.song-card .title{font-size:15px;font-weight:600}
.song-card .artist{font-size:12px;color:var(--sub);margin-top:3px}
.btn-add{
  width:38px;height:38px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-fav{
  width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);font-size:16px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;color:var(--sub)}
.btn-fav.faved{background:rgba(255,79,155,.25);border-color:var(--pink);color:var(--pink)}
#empty{text-align:center;color:#555;padding:40px 0;font-size:14px}

/* ===== QUEUE TAB ===== */
#tab-queue{padding:14px 16px}
.q-row{
  display:flex;align-items:center;padding:13px 14px;border-radius:14px;
  background:var(--card);margin-bottom:10px;gap:10px;border:1px solid rgba(255,255,255,.05)}
.q-row.playing{border-color:var(--accent);background:rgba(199,54,247,.12)}
.q-num{font-size:12px;color:var(--sub);width:22px;text-align:center}
.q-info{flex:1}
.q-title{font-size:14px;font-weight:600}
.q-meta{font-size:11px;color:var(--sub);margin-top:3px}
.q-acts{display:flex;gap:6px}
.q-act{
  padding:5px 10px;border-radius:8px;font-size:11px;border:none;
  background:rgba(255,255,255,.08);color:#fff}
.q-act.top{background:rgba(124,44,247,.5)}
.q-act.del{background:rgba(255,79,155,.2);color:var(--pink)}

/* ===== REMOTE TAB ===== */
#tab-remote{padding:20px 16px;display:flex;flex-direction:column;gap:16px}

/* Now playing bar */
#now-bar{
  background:rgba(199,54,247,.12);border:1px solid rgba(199,54,247,.3);
  border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
#now-bar .nb-info{flex:1}
#now-bar .nb-title{font-size:14px;font-weight:700}
#now-bar .nb-meta{font-size:11px;color:var(--sub);margin-top:2px}
#now-bar .nb-status{font-size:11px;color:var(--accent)}

/* Playback control row */
.ctrl-section{background:rgba(255,255,255,.04);border-radius:18px;padding:16px}
.ctrl-title{font-size:12px;color:var(--sub);letter-spacing:1px;margin-bottom:14px}
.ctrl-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ctrl-btn{
  flex:1;min-width:70px;max-width:90px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:12px 8px;border-radius:14px;cursor:pointer;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  transition:.15s;user-select:none}
.ctrl-btn:active{transform:scale(.93);background:rgba(199,54,247,.25);border-color:var(--accent)}
.ctrl-btn .ci{font-size:22px}
.ctrl-btn .cl{font-size:11px;color:var(--sub)}
.ctrl-btn.red .cl{color:var(--pink)}
.ctrl-btn.red:active{background:rgba(255,79,155,.25);border-color:var(--pink)}
.ctrl-btn.cyan .cl{color:var(--accent2)}
.ctrl-btn.cyan:active{background:rgba(54,217,247,.2);border-color:var(--accent2)}
.ctrl-btn.purple{background:rgba(199,54,247,.15);border-color:rgba(199,54,247,.35)}
.ctrl-btn.purple .cl{color:var(--accent)}

/* D-pad */
.dpad{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  grid-template-rows:1fr 1fr 1fr;gap:8px;max-width:220px;margin:0 auto}
.dpad-btn{
  display:flex;align-items:center;justify-content:center;
  height:64px;border-radius:14px;font-size:22px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  cursor:pointer;transition:.15s}
.dpad-btn:active{transform:scale(.9);background:rgba(54,217,247,.2);border-color:var(--accent2)}
.dpad-ok{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-size:15px;font-weight:700;border:none}
.dpad-empty{background:transparent;border:none;pointer-events:none}

/* ===== FAB queue ===== */
#queue-fab{
  position:fixed;right:16px;bottom:16px;z-index:20;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#000;font-weight:700;padding:13px 18px;border-radius:999px;
  font-size:13px;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 24px rgba(199,54,247,.4)
}
.fab-badge{background:rgba(0,0,0,.3);border-radius:999px;padding:1px 7px;font-size:12px}

/* ===== ONLINE TAB ===== */
#tab-online .search-box{
  margin:14px 16px 0;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.07);border-radius:14px;padding:11px 14px;
  border:1px solid rgba(255,255,255,.08)}
#tab-online .search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px}
.online-bar{display:flex;gap:10px;margin:10px 16px 0;align-items:center}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:10px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;color:var(--sub);font-size:12px;padding:6px 14px;border-radius:8px}
.seg button.on{background:rgba(199,54,247,.35);color:#fff}
.quality-sel{
  background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:7px 10px;font-size:12px;outline:none}
.o-card{
  display:flex;gap:10px;background:var(--card);border:1px solid rgba(255,255,255,.06);
  padding:10px;border-radius:14px;margin:0 16px 10px;align-items:center}
.o-card img{width:84px;height:53px;object-fit:cover;border-radius:8px;background:#222;flex-shrink:0}
.o-card .info{flex:1;min-width:0}
.o-card .title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.o-card .meta{font-size:11px;color:var(--sub);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.o-src{font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(54,217,247,.15);color:var(--accent2);flex-shrink:0}
.btn-dl{
  border:none;border-radius:10px;padding:8px 12px;font-size:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-dl:disabled{opacity:.45}
.task-row{
  display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:11px 12px;margin:0 16px 10px}
.task-row .info{flex:1;min-width:0}
.task-row .t-title{font-size:13px;font-weight:600}
.task-row .t-sub{font-size:11px;color:var(--sub);margin-top:3px}
.task-row .t-sub.err{color:var(--pink)}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.3s}
.online-h{font-size:12px;color:var(--sub);letter-spacing:1px;margin:16px 16px 10px}

/* ===== AI ASSISTANT TAB ===== */
#tab-ai{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ai-reco{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:12px}
.ai-reco .h{font-size:12px;color:var(--sub);margin-bottom:8px}
.ai-reco .row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.reco-pill{
  flex-shrink:0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;max-width:75%}
.reco-pill .info{min-width:0}
.reco-pill .t{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reco-pill .a{font-size:10px;color:var(--sub);white-space:nowrap}
.reco-pill button{
  border:none;border-radius:8px;padding:6px 8px;font-size:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
#ai-chat{display:flex;flex-direction:column;gap:10px;min-height:120px}
.ai-msg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.5}
.ai-msg.bot{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-top-left-radius:4px}
.ai-msg.user{background:rgba(199,54,247,.25);border:1px solid rgba(199,54,247,.3);align-self:flex-end;border-top-right-radius:4px}
.ai-songs{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ai-song{display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:rgba(255,255,255,.05);border-radius:10px;padding:7px 10px;font-size:12px}
.ai-song .st{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-song .ok{color:var(--accent2);flex-shrink:0}
.ai-song.missing{opacity:.6}
.ai-song.missing .go{color:var(--orange);flex-shrink:0;cursor:pointer}
.ai-chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--sub);
  border-radius:999px;padding:7px 13px;font-size:12px}
.chip:active{background:rgba(199,54,247,.25);color:#fff}
.ai-input-row{display:flex;gap:8px;position:sticky;bottom:70px}
.ai-input-row input{
  flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:12px 14px;color:var(--text);font-size:14px;outline:none}
.ai-input-row button{
  border:none;border-radius:14px;padding:0 18px;font-size:15px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.ai-input-row button:disabled{opacity:.5}
.typing{color:var(--sub);font-size:12px;padding:4px 2px}

/* ===== TOAST ===== */
#toast{
  position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-70px);
  background:#fff;color:#111;padding:9px 18px;border-radius:12px;
  font-size:13px;z-index:50;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.25)
}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="brand">骏耀K歌</div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('search',this)">🎵 点歌</div>
    <div class="tab" onclick="switchTab('queue',this)">📋 队列</div>
    <div class="tab" onclick="switchTab('remote',this)">🎮 遥控</div>
    <div class="tab" onclick="switchTab('online',this)">🌐 在线</div>
    <div class="tab" onclick="switchTab('ai',this)">🤖 助手</div>
    <div class="tab" onclick="switchTab('tasks',this)">📥 任务</div>
  </div>
</header>

<!-- ====== SEARCH TAB ====== -->
<div id="tab-search">
  <div class="search-box">
    <span>🔍</span>
    <input id="search-input" placeholder="搜索歌名 / 歌手">
  </div>
  <div class="nickname-row">
    <input id="nickname-input" placeholder="点歌昵称（可选）">
  </div>
  <div id="song-list"></div>
  <div id="empty" style="display:none">没有找到相关歌曲</div>
</div>

<!-- ====== QUEUE TAB ====== -->
<div id="tab-queue" style="display:none"></div>

<!-- ====== REMOTE TAB ====== -->
<div id="tab-remote" style="display:none">

  <!-- Now playing -->
  <div id="now-bar">
    <span style="font-size:26px">🎤</span>
    <div class="nb-info">
      <div class="nb-title" id="nb-title">暂无播放</div>
      <div class="nb-meta" id="nb-meta">—</div>
    </div>
    <span class="nb-status" id="nb-status"></span>
  </div>

  <!-- Playback controls -->
  <div class="ctrl-section">
    <div class="ctrl-title">▶ 播放控制</div>
    <div class="ctrl-row">
      <div class="ctrl-btn purple" onclick="sendCtrl('play_pause')">
        <span class="ci" id="r-play-icon">⏸</span><span class="cl" id="r-play-label">暂停</span>
      </div>
      <div class="ctrl-btn cyan" onclick="sendCtrl('voice')">
        <span class="ci">🎤</span><span class="cl" id="r-voice-label">原/伴唱</span>
      </div>
      <div class="ctrl-btn" onclick="sendCtrl('repeat')">
        <span class="ci">🔄</span><span class="cl">重唱</span>
      </div>
      <div class="ctrl-btn red" onclick="sendCtrl('next')">
        <span class="ci">⏭</span><span class="cl">切歌</span>
      </div>
    </div>
  </div>

  <!-- View controls -->
  <div class="ctrl-section">
    <div class="ctrl-title">📺 TV界面</div>
    <div class="ctrl-row">
      <div class="ctrl-btn" onclick="sendCtrl('home')">
        <span class="ci">🏠</span><span class="cl">主页</span>
      </div>
      <div class="ctrl-btn cyan" onclick="sendCtrl('fullscreen')">
        <span class="ci">⛶</span><span class="cl">全屏</span>
      </div>
      <div class="ctrl-btn" onclick="sendCtrl('back')">
        <span class="ci">←</span><span class="cl">返回</span>
      </div>
    </div>
  </div>

  <!-- D-pad -->
  <div class="ctrl-section">
    <div class="ctrl-title">🕹 方向导航</div>
    <div class="dpad">
      <div class="dpad-btn dpad-empty"></div>
      <div class="dpad-btn" onclick="sendCtrl('focus_up')">▲</div>
      <div class="dpad-btn dpad-empty"></div>
      <div class="dpad-btn" onclick="sendCtrl('focus_left')">◀</div>
      <div class="dpad-btn dpad-ok" onclick="sendCtrl('ok')">确认</div>
      <div class="dpad-btn" onclick="sendCtrl('focus_right')">▶</div>
      <div class="dpad-btn dpad-empty"></div>
      <div class="dpad-btn" onclick="sendCtrl('focus_down')">▼</div>
      <div class="dpad-btn dpad-empty"></div>
    </div>
  </div>

</div>

<!-- ====== ONLINE TAB ====== -->
<div id="tab-online" style="display:none">
  <div class="search-box">
    <span>🔍</span>
    <input id="online-input" placeholder="搜 B站 / YouTube 上的 MV">
  </div>
  <div class="online-bar">
    <div class="seg">
      <button id="seg-bili" class="on" onclick="setOnlineSource('bilibili')">B站</button>
      <button id="seg-yt" onclick="setOnlineSource('youtube')">YouTube</button>
    </div>
    <select id="quality-sel" class="quality-sel">
      <option value="480">480P 省空间</option>
      <option value="720" selected>720P 推荐</option>
      <option value="1080">1080P 高清</option>
    </select>
  </div>
  <div id="online-list" style="margin-top:12px"></div>
</div>

<!-- ====== AI ASSISTANT TAB ====== -->
<div id="tab-ai" style="display:none">
  <div class="ai-reco">
    <div class="h">✨ 为你推荐</div>
    <div class="row" id="ai-reco-row"><span class="typing">加载中…</span></div>
  </div>
  <div id="ai-chat">
    <div class="ai-msg bot">你好呀!跟我说句想唱的感觉,我来帮你点歌 🎤<br>比如「来首适合现在的粤语歌」</div>
  </div>
  <div class="ai-chips">
    <button class="chip" onclick="aiQuick(this)">来点怀旧金曲</button>
    <button class="chip" onclick="aiQuick(this)">来首粤语伤感</button>
    <button class="chip" onclick="aiQuick(this)">气氛热起来!</button>
    <button class="chip" onclick="aiQuick(this)">点首小众好歌</button>
  </div>
  <div class="ai-input-row">
    <input id="ai-input" placeholder="想唱什么,说一句…">
    <button id="ai-send" onclick="aiSend()">🎵</button>
  </div>
</div>

<!-- ====== TASKS TAB ====== -->
<div id="tab-tasks" style="display:none">
  <div class="online-h" style="margin:14px 16px 10px">⬇ 下载 / AI 分离任务</div>
  <div id="online-tasks"></div>
</div>

<div id="queue-fab" onclick="switchTabByName('queue')">
  🎵 当前队列 <span class="fab-badge" id="fab-badge">0</span>
</div>
<div id="toast"></div>

<script>
const searchInput = document.getElementById('search-input');
const nicknameInput = document.getElementById('nickname-input');
nicknameInput.value = localStorage.getItem('ktv_nick') || '';
nicknameInput.addEventListener('change', ()=>localStorage.setItem('ktv_nick', nicknameInput.value));

// ===== Tabs =====
function switchTab(name, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById('tab-search').style.display = name==='search' ? 'block' : 'none';
  document.getElementById('tab-queue').style.display = name==='queue' ? 'block' : 'none';
  document.getElementById('tab-remote').style.display = name==='remote' ? 'block' : 'none';
  document.getElementById('tab-online').style.display = name==='online' ? 'block' : 'none';
  document.getElementById('tab-ai').style.display = name==='ai' ? 'block' : 'none';
  document.getElementById('tab-tasks').style.display = name==='tasks' ? 'block' : 'none';
  if(name==='queue') renderQueue();
  if(name==='ai' && !aiRecoLoaded) loadReco();
  if(name==='tasks') pollTasks();
}
function switchTabByName(name){
  const tabs=document.querySelectorAll('.tab');
  const idx={'search':0,'queue':1,'remote':2,'online':3,'ai':4,'tasks':5}[name]||0;
  switchTab(name, tabs[idx]);
}

// ===== WS =====
let queueData=[];
let isPlaying=false, localPaused=false, localVoice=true;

function connectWS(){
  const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);
  ws.onmessage=ev=>{
    const msg=JSON.parse(ev.data);
    if(msg.type==='queue'){queueData=msg.data;onQueue();}
  };
  ws.onclose=()=>setTimeout(connectWS,2000);
  window._ws=ws;
}
connectWS();

function sendCtrl(action){ sendWS({type:'control',action}); }
function sendWS(obj){ if(window._ws&&window._ws.readyState===1) window._ws.send(JSON.stringify(obj)); }

function onQueue(){
  const playing=queueData.find(q=>q.status==='playing');
  document.getElementById('fab-badge').textContent=queueData.length;
  if(playing){
    document.getElementById('nb-title').textContent=playing.title;
    document.getElementById('nb-meta').textContent=`${playing.artist} · ${playing.nickname}`;
    document.getElementById('nb-status').textContent='♪ 播放中';
  } else {
    document.getElementById('nb-title').textContent='暂无播放';
    document.getElementById('nb-meta').textContent='—';
    document.getElementById('nb-status').textContent='';
  }
  if(document.getElementById('tab-queue').style.display!=='none') renderQueue();
}

function renderQueue(){
  const el=document.getElementById('tab-queue');
  el.innerHTML='';
  if(!queueData.length){el.innerHTML='<div style="color:#555;text-align:center;padding:40px">队列空空如也</div>';return;}
  queueData.forEach((q,i)=>{
    const row=document.createElement('div');
    row.className='q-row'+(q.status==='playing'?' playing':'');
    row.innerHTML=`
      <div class="q-num">${q.status==='playing'?'♪':i+1}</div>
      <div class="q-info"><div class="q-title">${q.title}</div><div class="q-meta">${q.artist} · ${q.nickname}</div></div>
      <div class="q-acts">
        ${q.status!=='playing'?`<button class="q-act top" onclick="topSong(${q.queue_id})">置顶</button>`:''}
        <button class="q-act del" onclick="delSong(${q.queue_id})">✕</button>
      </div>`;
    el.appendChild(row);
  });
}

async function topSong(id){ await fetch(`/api/queue/${id}/top`,{method:'POST'}); }
async function delSong(id){ await fetch(`/api/queue/${id}`,{method:'DELETE'}); }

// ===== Song search & add =====
let searchTimer;
searchInput.addEventListener('input',()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>loadSongs(searchInput.value.trim()),220);
});
async function loadSongs(q=''){
  const res=await fetch(`/api/songs${q?`?q=${encodeURIComponent(q)}`:''}`);
  renderSongs(await res.json());
}
function renderSongs(list){
  const el=document.getElementById('song-list');
  document.getElementById('empty').style.display=list.length?'none':'block';
  el.innerHTML='';
  list.forEach(s=>{
    const c=document.createElement('div');
    c.className='song-card';
    const favKey='fav_'+s.id;
    const isFaved=localStorage.getItem(favKey)==='1';
    c.innerHTML=`
      <div class="info"><div class="title">${s.title}</div><div class="artist">${s.artist||''}${s.audio_tracks===1?' <span style="color:#666">· 单音轨</span>':''}</div></div>
      <div style="display:flex;gap:6px;align-items:center">
        ${s.audio_tracks===1?'<button class="btn-fav sep-btn" title="AI生成伴奏(需几分钟)">🎛</button>':''}
        <button class="btn-fav fav-btn${isFaved?' faved':''}">❤</button>
        <button class="btn-add">＋</button>
      </div>`;
    c.querySelector('.btn-add').onclick=()=>addSong(s.id, s.title);
    c.querySelector('.fav-btn').onclick=()=>toggleFav(s.id, c.querySelector('.fav-btn'));
    const sepBtn=c.querySelector('.sep-btn');
    if(sepBtn) sepBtn.onclick=()=>separateSong(s);
    el.appendChild(c);
  });
}
async function addSong(id, title){
  const nick=nicknameInput.value.trim()||'匿名歌手';
  await fetch('/api/queue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({song_id:id,nickname:nick})});
  showToast(`《${title}》已加入队列 🎶`);
}

async function separateSong(s){
  try{
    const res=await fetch('/api/online/separate',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({filename:s.filename})
    });
    const d=await res.json();
    if(!res.ok) throw new Error(d.error||res.status);
    if(d.skipped){showToast('这首歌已是双音轨啦');return;}
    showToast('已加入 AI 分离队列 🎛 完成后自动替换');
    switchTabByName('online');
    pollTasks();
  }catch(e){showToast('失败:'+String(e.message||e));}
}

// ===== AI 点歌助手(Phase 3a/3b) =====
let aiRecoLoaded=false, aiBusy=false;
const aiChat=document.getElementById('ai-chat');

function aiBubble(text, who){
  const d=document.createElement('div');
  d.className='ai-msg '+who;
  d.textContent=text;
  aiChat.appendChild(d);
  d.scrollIntoView({behavior:'smooth',block:'end'});
  return d;
}
let aiMissing=[];
function aiSongsBlock(added, missing){
  const d=document.createElement('div');
  d.className='ai-msg bot';
  const base=aiMissing.length;
  (missing||[]).forEach(s=>aiMissing.push(s));
  let html='<div class="ai-songs">';
  (added||[]).forEach(s=>{html+=`<div class="ai-song"><span class="st">🎤 ${escHtml(s.artist)} - ${escHtml(s.title)}</span><span class="ok">已入队✓</span></div>`;});
  (missing||[]).forEach((s,i)=>{html+=`<div class="ai-song missing"><span class="st">${escHtml(s.artist)} - ${escHtml(s.title)}</span><span class="go" data-i="${base+i}">在线搜→</span></div>`;});
  html+='</div>';
  d.innerHTML=html;
  d.querySelectorAll('.go').forEach(el=>el.onclick=()=>{
    const s=aiMissing[Number(el.dataset.i)]||{};
    onlineInput.value=((s.artist||'')+' '+(s.title||'')).trim();
    switchTabByName('online');
    onlineSearch();
  });
}
async function aiSend(){
  if(aiBusy) return;
  const input=document.getElementById('ai-input');
  const prompt=input.value.trim();
  if(!prompt) return;
  input.value='';aiBusy=true;
  document.getElementById('ai-send').disabled=true;
  aiBubble(prompt,'user');
  const typing=aiBubble('正在想歌…','bot');
  try{
    const res=await fetch('/api/ai/request',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt,nickname:nicknameInput.value.trim()||'AI助手'})
    });
    const d=await res.json();
    typing.remove();
    if(!res.ok) throw new Error(d.error||res.status);
    aiBubble(d.reply||'点好啦!','bot');
    if((d.added&&d.added.length)||(d.missing&&d.missing.length)) aiSongsBlock(d.added,d.missing);
  }catch(e){
    typing.remove();
    aiBubble('出了点小状况:'+String(e.message||e),'bot');
  }
  aiBusy=false;
  document.getElementById('ai-send').disabled=false;
}
document.getElementById('ai-input').addEventListener('keydown',e=>{if(e.key==='Enter')aiSend();});
function aiQuick(btn){ document.getElementById('ai-input').value=btn.textContent; aiSend(); }
async function loadReco(){
  aiRecoLoaded=true;
  const row=document.getElementById('ai-reco-row');
  try{
    const res=await fetch('/api/ai/recommend');
    const d=await res.json();
    if(!res.ok) throw new Error(d.error||res.status);
    row.innerHTML='';
    if(d.reply){aiBubble('✨ '+d.reply,'bot');}
    if(!d.songs||!d.songs.length){row.innerHTML='<span class="typing">'+escHtml(d.reply||'曲库歌曲再多些再来推荐吧')+'</span>';return;}
    d.songs.forEach(s=>{
      const p=document.createElement('div');
      p.className='reco-pill';
      p.innerHTML=`<div class="info"><div class="t">${escHtml(s.title)}</div><div class="a">${escHtml(s.artist||'')}</div></div><button>＋点</button>`;
      p.querySelector('button').onclick=()=>{addSong(s.id,s.title);p.querySelector('button').textContent='已点✓';};
      row.appendChild(p);
    });
  }catch(e){
    row.innerHTML='<span class="typing">推荐服务暂不可用</span>';
  }
}

function getDevId(){
  let id=localStorage.getItem('ktvdev');
  if(!id){id='m-'+Math.random().toString(36).substr(2,9);localStorage.setItem('ktvdev',id);}
  return id;
}
async function toggleFav(id,btn){
  const key='fav_'+id;
  const faved=localStorage.getItem(key)==='1';
  if(faved){
    await fetch(`/api/favorites/${id}?device=${getDevId()}`,{method:'DELETE'});
    localStorage.removeItem(key);btn.classList.remove('faved');showToast('已取消收藏');
  } else {
    await fetch(`/api/favorites/${id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device:getDevId()})});
    localStorage.setItem(key,'1');btn.classList.add('faved');showToast('已收藏 ❤');
  }
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);
}

// ===== 在线搜索 & 下载(代理 ktv-tools) =====
let onlineSource='bilibili', onlineTimer, tasksTimer, lastDoneTitles={}, taskBtns={};
const onlineInput=document.getElementById('online-input');

function setOnlineSource(s){
  onlineSource=s;
  document.getElementById('seg-bili').classList.toggle('on',s==='bilibili');
  document.getElementById('seg-yt').classList.toggle('on',s==='youtube');
  if(onlineInput.value.trim()) onlineSearch();
}
onlineInput.addEventListener('input',()=>{
  clearTimeout(onlineTimer);
  onlineTimer=setTimeout(()=>onlineSearch(),400);
});
async function onlineSearch(){
  const q=onlineInput.value.trim();
  if(!q){document.getElementById('online-list').innerHTML='';return;}
  const el=document.getElementById('online-list');
  el.innerHTML='<div style="color:#555;text-align:center;padding:26px;font-size:13px">搜索中…</div>';
  const source = onlineSource==='youtube' ? 'youtube' : 'bilibili';
  try{
    const res=await fetch(`/api/online/search?q=${encodeURIComponent(q)}&source=${source}`);
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||res.status);
    renderOnline(data.results||[], source);
  }catch(e){
    el.innerHTML=`<div style="color:#888;text-align:center;padding:26px;font-size:13px">搜索失败:${escHtml(String(e.message||e))}</div>`;
  }
}
function renderOnline(list, source){
  const el=document.getElementById('online-list');
  if(!list.length){el.innerHTML='<div style="color:#555;text-align:center;padding:26px;font-size:13px">没有结果,换个关键词或切到另一个源</div>';return;}
  el.innerHTML='';
  list.forEach(item=>{
    const c=document.createElement('div');
    c.className='o-card';
    c.innerHTML=`
      <img src="/api/online/thumbnail?url=${encodeURIComponent(item.thumbnail||'')}" alt="" onerror="this.style.visibility='hidden'">
      <div class="info">
        <div class="title">${escHtml(item.title)}</div>
        <div class="meta">
          <span class="o-src">${item.source==='youtube'?'YT':'B站'}</span>
          <span>${escHtml(item.channel||'')}</span>
          <span>${escHtml(item.duration||'')}</span>
        </div>
      </div>
      <button class="btn-dl">下载</button>`;
    c.querySelector('.btn-dl').onclick=()=>startDownload(item, c.querySelector('.btn-dl'));
    el.appendChild(c);
  });
}
async function startDownload(item, btn){
  btn.disabled=true;btn.textContent='…';btn.style.background='';
  const quality=document.getElementById('quality-sel').value;
  try{
    const res=await fetch('/api/online/download',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url:item.url,title:item.title,artist:'',quality})
    });
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||res.status);
    taskBtns[data.task_id]={btn};
    btn.textContent='排队中';
    showToast('已加入下载队列 ⬇');
    pollTasks();
  }catch(e){
    showToast('下载失败:'+String(e.message||e));
    btn.disabled=false;btn.textContent='下载';
  }
}
// 把任务状态同步回对应卡片上的下载按钮:排队中 → 百分比 → AI分离 → 已入库✓/重试
function updateTaskButtons(tasks){
  tasks.forEach(t=>{
    const ref=taskBtns[t.id];
    if(!ref||!ref.btn.isConnected) return;
    const b=ref.btn;
    if(t.status==='queued'){b.textContent='排队中';}
    else if(t.status==='downloading'){b.textContent=(t.progress||0)+'%';}
    else if(t.status==='moving'){b.textContent='入库中';}
    else if(t.status==='extracting'){b.textContent='提取音频';}
    else if(t.status==='separating'){b.textContent='AI分离中';}
    else if(t.status==='merging'){b.textContent='合成音轨';}
    else if(t.status==='lyrics'){b.textContent='内嵌歌词';}
    else if(t.status==='done'){
      b.textContent='已入库✓';
      b.style.background='rgba(54,217,247,.35)';
    }else if(t.status==='failed'){
      b.disabled=false;b.textContent='重试';
      b.style.background='rgba(255,79,155,.35)';
    }
  });
}
function pollTasks(){
  if(tasksTimer) return;
  tasksTimer=setInterval(async ()=>{
    try{
      const res=await fetch('/api/online/tasks');
      const tasks=await res.json();
      renderTasks(tasks);
      updateTaskButtons(tasks);
      const active=tasks.some(t=>['queued','downloading','moving'].includes(t.status));
      const finishedNow=tasks.find(t=>t.status==='done'&&t.result&&!lastDoneTitles[t.id]);
      if(finishedNow){
        lastDoneTitles[finishedNow.id]=true;
        showToast(`《${finishedNow.artist||''} ${finishedNow.title}》已入库 🎶`);
        fetch('/api/scan',{method:'POST'});
        loadSongs(finishedNow.title);
      }
      if(!active){clearInterval(tasksTimer);tasksTimer=null;}
    }catch(e){/* 工具服务暂不可达,下轮再试 */}
  },2000);
}
function renderTasks(tasks){
  const wrap=document.getElementById('online-tasks');
  wrap.innerHTML='';
  if(!tasks.length){
    wrap.innerHTML='<div style="color:#555;text-align:center;padding:40px 0;font-size:13px">暂无任务,去「在线」Tab 搜歌下载吧</div>';
    return;
  }
  const stMap={queued:'排队中',downloading:'下载中',moving:'入库中',extracting:'提取音频',separating:'AI分离中',merging:'合成双音轨',lyrics:'内嵌歌词中',done:'已完成',failed:'失败'};
  tasks.slice(0,10).forEach(t=>{
    const row=document.createElement('div');
    row.className='task-row';
    const pct=t.status==='done'?100:Math.max(2,t.progress||0);
    row.innerHTML=`
      <div class="info">
        <div class="t-title">${escHtml((t.artist?t.artist+' - ':'')+t.title)}</div>
        <div class="t-sub${t.status==='failed'?' err':''}">${
          t.status==='failed' ? escHtml(t.error||'失败') :
          t.status==='done' ? escHtml(t.result?.filename||stMap[t.status]) : (stMap[t.status]||t.status)+' '+pct+'%'
        }</div>
        <div class="bar"><i style="width:${pct}%"></i></div>
      </div>`;
    wrap.appendChild(row);
  });
}
function escHtml(s){
  return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
pollTasks();

loadSongs();
fetch('/api/queue').then(r=>r.json()).then(d=>{queueData=d;onQueue();});
</script>
